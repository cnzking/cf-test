<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>方块电子时钟 By zzzwb.com</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
  min-height:100vh;
  background:#111;
  display:flex;
  align-items:center;
  justify-content:center;
}
.wrap{
  display:flex;
  gap:10px;
  align-items:center;
}
.num{
  width:80px;
  height:110px;
  background:#222;
  color:#fff;
  font-size:76px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:6px;
}
.colon{
  color:#fff;
  font-size:76px;
}
</style>
</head>
<body>
<div class="wrap">
  <div class="num" id="h1"></div>
  <div class="num" id="h2"></div>
  <div class="colon">:</div>
  <div class="num" id="m1"></div>
  <div class="num" id="m2"></div>
  <div class="colon">:</div>
  <div class="num" id="s1"></div>
  <div class="num" id="s2"></div>
</div>

<script>
function update() {
  const now = new Date();
  const h = String(now.getHours()).padStart(2,'0');
  const m = String(now.getMinutes()).padStart(2,'0');
  const s = String(now.getSeconds()).padStart(2,'0');
  document.getElementById('h1').textContent = h[0];
  document.getElementById('h2').textContent = h[1];
  document.getElementById('m1').textContent = m[0];
  document.getElementById('m2').textContent = m[1];
  document.getElementById('s1').textContent = s[0];
  document.getElementById('s2').textContent = s[1];
}
update();
setInterval(update,1000);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>翻页时钟</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui, sans-serif;}
body{
  min-height:100vh;
  background:#111;
  display:flex;
  align-items:center;
  justify-content:center;
}
.clock-wrap{
  display:flex;
  gap:12px;
}
.flip-card{
  position:relative;
  width:90px;
  height:120px;
  perspective: 200px;
}
.flip-card .num{
  width:100%;
  height:100%;
  position:absolute;
  color:#fff;
  font-size:80px;
  text-align:center;
  line-height:120px;
  background:#222;
  border-radius:8px;
  overflow:hidden;
  box-shadow:0 4px 10px #0008;
}
.flip-card .top{
  height:50%;
  width:100%;
  position:absolute;
  top:0;
  backface-visibility:hidden;
  transform-origin:bottom center;
  border-bottom:1px solid #000;
}
.flip-card .bottom{
  height:50%;
  width:100%;
  position:absolute;
  bottom:0;
  backface-visibility:hidden;
  transform-origin:top center;
}
.flip-card.flip .top{
  animation: flipTop 0.6s ease-in forwards;
}
.flip-card.flip .bottom{
  animation: flipBottom 0.6s ease-out forwards;
}
@keyframes flipTop{
  0%{transform:rotateX(0deg);z-index:2;}
  100%{transform:rotateX(-180deg);z-index:1;}
}
@keyframes flipBottom{
  0%{transform:rotateX(180deg);z-index:1;}
  100%{transform:rotateX(0deg);z-index:2;}
}
.sep{
  color:#fff;
  font-size:80px;
  line-height:120px;
}
</style>
</head>
<body>
<div class="clock-wrap">
  <div class="flip-card" id="h1"><div class="num top"></div><div class="num bottom"></div></div>
  <div class="flip-card" id="h2"><div class="num top"></div><div class="num bottom"></div></div>
  <div class="sep">:</div>
  <div class="flip-card" id="m1"><div class="num top"></div><div class="num bottom"></div></div>
  <div class="flip-card" id="m2"><div class="num top"></div><div class="num bottom"></div></div>
  <div class="sep">:</div>
  <div class="flip-card" id="s1"><div class="num top"></div><div class="num bottom"></div></div>
  <div class="flip-card" id="s2"><div class="num top"></div><div class="num bottom"></div></div>
</div>

<script>
const cards = {
  h1: document.getElementById('h1'),
  h2: document.getElementById('h2'),
  m1: document.getElementById('m1'),
  m2: document.getElementById('m2'),
  s1: document.getElementById('s1'),
  s2: document.getElementById('s2'),
};
let oldTime = {h1:'',h2:'',m1:'',m2:'',s1:'',s2:''};

function updateClock(){
  const now = new Date();
  const h = String(now.getHours()).padStart(2,'0');
  const m = String(now.getMinutes()).padStart(2,'0');
  const s = String(now.getSeconds()).padStart(2,'0');
  const newTime = {
    h1: h[0], h2: h[1],
    m1: m[0], m2: m[1],
    s1: s[0], s2: s[1],
  };
  for(const key in newTime){
    if(newTime[key] !== oldTime[key]){
      const card = cards[key];
      card.classList.remove('flip');
      card.querySelector('.top').textContent = oldTime[key];
      card.querySelector('.bottom').textContent = newTime[key];
      void card.offsetWidth; // 触发重绘
      card.classList.add('flip');
      oldTime[key] = newTime[key];
    }
  }
}
updateClock();
setInterval(updateClock, 1000);
</script>
</body>
</html>
